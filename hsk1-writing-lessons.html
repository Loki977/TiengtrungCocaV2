<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK1 - Sơ cấp</title>
  <link rel="icon" href="assets/images/brand/favicon-orange.png" type="image/png" />
  <style>
    :root {
      --page-bg: #edf5f7;
      --navy: #10234a;
      --muted: #858aa3;
      --cream: #fffdf5;
      --line: rgba(247, 180, 0, 0.28);
      --yellow: #f7b400;
      --yellow-2: #ffc21a;
      --orange: #ff8a2a;
      --shadow: 0 16px 34px rgba(39, 62, 92, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.92), transparent 27%),
        linear-gradient(135deg, #eaf4f6 0%, #f4f8f4 50%, #e8f1f5 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .header {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 18px;
      align-items: center;
      margin-bottom: 30px;
    }

    .back-btn {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 1px solid rgba(247, 180, 0, 0.26);
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      box-shadow: 0 12px 24px rgba(255, 138, 42, 0.22);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(255, 138, 42, 0.28);
    }

    .back-btn svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 950;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.5;
      font-weight: 750;
    }

    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .lesson-card {
      position: relative;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) 34px;
      gap: 18px;
      align-items: center;
      min-height: 138px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        linear-gradient(138deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 253, 245, 0.97) 52%, rgba(255, 244, 202, 0.58) 100%);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 170ms ease, border-color 170ms ease, box-shadow 170ms ease;
    }

    .lesson-card::before {
      content: "";
      position: absolute;
      inset: auto -22px -52px -22px;
      height: 96px;
      background:
        radial-gradient(ellipse at 18% 90%, rgba(255, 255, 255, 0.88) 0 20%, transparent 21%),
        radial-gradient(ellipse at 52% 92%, rgba(255, 255, 255, 0.72) 0 18%, transparent 19%),
        radial-gradient(ellipse at 82% 90%, rgba(255, 255, 255, 0.82) 0 22%, transparent 23%),
        linear-gradient(135deg, transparent 0 28%, rgba(247, 180, 0, 0.08) 29% 42%, transparent 43%);
      opacity: 0.76;
      pointer-events: none;
    }

    .lesson-card:hover {
      transform: translateY(-3px);
      border-color: rgba(247, 180, 0, 0.68);
      box-shadow: 0 21px 42px rgba(39, 62, 92, 0.15);
    }

    .lesson-card.is-locked {
      opacity: 0.72;
      filter: saturate(0.72);
    }

    .lesson-access {
      display: inline-flex;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(39, 62, 92, 0.08);
      color: var(--navy);
      font-size: 12px;
      font-weight: 900;
    }

    .lesson-number {
      position: relative;
      z-index: 1;
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--yellow), var(--yellow-2));
      box-shadow: inset 0 0 0 7px rgba(255, 249, 229, 0.48), 0 10px 20px rgba(247, 180, 0, 0.22);
      font-size: 23px;
      font-weight: 950;
    }

    .lesson-content {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .lesson-label {
      margin: 0 0 4px;
      color: #d58700;
      font-size: 15px;
      line-height: 1.25;
      font-weight: 950;
    }

    .lesson-title {
      margin: 0;
      color: var(--navy);
      font-size: clamp(20px, 2.2vw, 25px);
      line-height: 1.22;
      letter-spacing: 0;
      font-weight: 950;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 850;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--yellow);
    }

    .chevron {
      position: relative;
      z-index: 1;
      justify-self: end;
      color: var(--orange);
      font-size: 56px;
      line-height: 1;
      font-weight: 700;
    }

    @media (max-width: 840px) {
      .page {
        width: min(100% - 30px, 620px);
        padding-top: 24px;
      }

      .lesson-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .header {
        grid-template-columns: 50px minmax(0, 1fr);
        gap: 14px;
      }

      .back-btn {
        width: 50px;
        height: 50px;
        border-radius: 17px;
      }

      .lesson-card {
        grid-template-columns: 52px minmax(0, 1fr) 24px;
        gap: 12px;
        min-height: 134px;
        padding: 18px;
      }

      .lesson-number {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }

      .chevron {
        font-size: 42px;
      }

      .stat {
        font-size: 13px;
      }
    }
  </style>
  <link rel="stylesheet" href="assets/css/dark-mode.css" />
  <link rel="stylesheet" href="assets/css/app-shell.css?v=7" />
  <script src="assets/js/dark-mode.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="back-btn" href="hsk-writing.html" aria-label="Quay lại chọn cấp độ">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5"></path>
          <path d="m11 6-6 6 6 6"></path>
        </svg>
      </a>
      <div>
        <h1 id="pageTitle">HSK1 - Sơ cấp</h1>
        <p class="subtitle" id="pageSubtitle">Giao tiếp sinh hoạt hằng ngày</p>
      </div>
    </header>

    <section class="lesson-grid" id="lessonGrid" aria-label="Danh sách bài học HSK"></section>
  </main>

  <script src="assets/js/site-shell.js?v=5"></script>
  <script src="assets/js/hsk-learning-access.js"></script>
  <script type="module">
    import { getLessonConfig } from "./lesson-config.js";
    import { generateLessons, normalizeWritingLessonContent } from "./lesson-engine.js";

    const FIRESTORE_MODULE = "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
    const params = new URLSearchParams(window.location.search);
    const level = (params.get("level") || "hsk1").toLowerCase();
    const config = getLessonConfig(level) || getLessonConfig("hsk1");

    async function loadWritingRemoteState() {
      try {
        await import("./assets/js/firebase-auth.js?v=auth-ui-20260726");
        const shared = window.CCFirebase;
        if (!shared?.db) return { overrides:new Map(), settings:{}, shared:null };
        await shared.authReady;
        const { collection, doc, getDoc, getDocs, query, where } = await import(FIRESTORE_MODULE);
        const overrideQuery = query(collection(shared.db, "writingLessonOverrides"), where("level", "==", config.level));
        const [snapshot, settingsSnap] = await Promise.all([
          getDocs(overrideQuery),
          getDoc(doc(shared.db, "adminSettings", "learning"))
        ]);
        const overrides = new Map();
        snapshot.forEach((item) => {
          const data = item.data() || {};
          const lessonId = Number(data.lessonId);
          if (data.level === config.level && Number.isInteger(lessonId) && lessonId > 0) {
            overrides.set(lessonId, data.content || data);
          }
        });
        return { overrides, settings:settingsSnap.exists() ? settingsSnap.data() : {}, shared };
      } catch (error) {
        console.warn("[writing-list] Không tải được nội dung CMS, dùng dữ liệu chuẩn.", error);
        return { overrides:new Map(), settings:{}, shared:window.CCFirebase || null };
      }
    }

    const lessonContentPromise = generateLessons(config.level, config);
    const remoteStatePromise = Promise.race([
      loadWritingRemoteState(),
      new Promise((resolve) => window.setTimeout(() => resolve({ overrides:new Map(), settings:{}, shared:window.CCFirebase || null }), 3000))
    ]);
    const [lessonContent, remoteState] = await Promise.all([lessonContentPromise, remoteStatePromise]);
    const { overrides, settings, shared } = remoteState;
    const lessons = lessonContent.map((item, index) => {
      const override = overrides.get(item.lessonId);
      const resolved = override ? normalizeWritingLessonContent(override, item) : item;
      return {
        lesson: `Bài ${resolved.lessonId}`,
        title: resolved.title,
        words: resolved.vocabularies.length,
        sentences: resolved.sentences.length
      };
    });

    document.title = config.label;
    document.getElementById("pageTitle").textContent = config.label;
    document.getElementById("pageSubtitle").textContent = config.description;
    document.getElementById("lessonGrid").setAttribute("aria-label", `Danh sách bài học ${config.level.toUpperCase()}`);
    const lessonGrid = document.getElementById("lessonGrid");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[char]));
    }

    function getAccess(lessonId) {
      const area = settings?.writing?.courses ? settings.writing : settings;
      const course = area?.courses?.[config.level] || settings?.courses?.[config.level] || {};
      const raw = course.lessons?.[`B${lessonId}`] || course.lessons?.[String(lessonId)] || {};
      const enabled = course.enabled !== false && raw.enabled !== false && raw.unlockType !== "locked";
      const known = ["free", "guided", "vip", "coins"];
      let unlockType = known.includes(String(raw.unlockType || "").toLowerCase())
        ? String(raw.unlockType).toLowerCase()
        : (course.guided === false ? "free" : "guided");
      if (Number(area?.accessModeVersion || 0) < 2 && unlockType === "free" && course.guided !== false) unlockType = "guided";
      return { enabled, unlockType, coinCost:Math.max(0, Number(raw.coinCost || 0)) };
    }

    function hasCoinUnlock(lessonId) {
      const stats = shared?.getCurrentStats?.() || {};
      if (stats.unlockedAll) return true;
      return [`writing:${config.level}`, config.level].some((key) => {
        const opened = stats.unlockedLessons?.[key];
        return Array.isArray(opened) && opened.map(String).includes(String(lessonId));
      });
    }

    function pathAccess(lessonId) {
      const pathSettings = settings?.writing?.courses ? { courses:settings.writing.courses } : settings;
      return window.CCHskLearningAccess?.resolveLessonAccess?.({
        level:config.level,
        lessonId,
        stats:shared?.getCurrentStats?.() || {},
        settings:pathSettings
      }) || { allowed:true, message:"" };
    }

    function accessView(lessonId) {
      const access = getAccess(lessonId);
      if (!access.enabled) return { allowed:false, label:"Đang đóng" };
      if (access.unlockType === "guided") {
        const path = pathAccess(lessonId);
        return { allowed:path.allowed, label:path.allowed ? "Theo lộ trình · Đã mở" : "Theo lộ trình", message:path.message };
      }
      if (access.unlockType === "vip") {
        const active = Boolean(shared?.vip?.isActive?.(shared?.getCurrentStats?.() || {}));
        return { allowed:active, label:active ? "VIP · Đã mở" : "Dành cho VIP" };
      }
      if (access.unlockType === "coins") {
        const opened = hasCoinUnlock(lessonId);
        return { allowed:opened, label:opened ? "Xu · Đã mở" : `Mở ${access.coinCost.toLocaleString("vi-VN")} xu` };
      }
      return { allowed:true, label:"Miễn phí" };
    }

    function renderLessons() {
      lessonGrid.innerHTML = lessons.map((item, index) => {
        const lessonId = index + 1;
        const view = accessView(lessonId);
        return `
          <a class="lesson-card ${view.allowed ? "" : "is-locked"}" data-writing-lesson="${lessonId}" href="lesson.html?level=${encodeURIComponent(config.level)}&lesson=${lessonId}">
            <div class="lesson-number">${lessonId}</div>
            <div class="lesson-content">
              <p class="lesson-label">${escapeHtml(item.lesson)}</p>
              <h2 class="lesson-title">${escapeHtml(item.title)}</h2>
              <div class="stats" aria-label="Thống kê bài học">
                <span class="stat"><span class="dot"></span>${item.words} từ vựng</span>
                <span class="stat"><span class="dot"></span>${item.sentences} câu</span>
              </div>
              <span class="lesson-access">${escapeHtml(view.label)}</span>
            </div>
            <div class="chevron" aria-hidden="true">›</div>
          </a>
        `;
      }).join("");
    }

    renderLessons();
    lessonGrid.addEventListener("click", async (event) => {
      const card = event.target.closest("[data-writing-lesson]");
      if (!card) return;
      const lessonId = Number(card.dataset.writingLesson);
      const access = getAccess(lessonId);
      const view = accessView(lessonId);
      if (view.allowed) return;
      event.preventDefault();
      if (!access.enabled) return alert("Bài Luyện viết này đang được Admin đóng.");
      if (access.unlockType === "guided") return alert(view.message || "Hãy hoàn thành bài học phía trước để mở khóa.");
      if (access.unlockType === "vip") {
        const result = await shared?.getFreshVipAccess?.({ syncUi:true });
        if (result?.verified && result?.state?.active) return location.assign(card.href);
        const message = "Bài Luyện viết này dành cho thành viên VIP.";
        (shared?.vip?.openPurchase || window.CCVip?.openPurchase)?.({ reason:message, user:shared?.getCurrentUser?.() || null, backUrl:location.href });
        return;
      }
      if (access.unlockType === "coins") {
        if (!shared?.getCurrentUser?.()) return alert("Vui lòng đăng nhập để mở bài bằng xu.");
        if (!confirm(`Dùng ${access.coinCost.toLocaleString("vi-VN")} xu để mở Bài ${lessonId}?`)) return;
        try {
          await shared.unlockLessonWithCoins({ level:config.level, lessonId, coinCost:access.coinCost, scope:"writing" });
          location.assign(card.href);
        } catch (error) {
          alert(error?.message || "Không thể mở bài bằng xu.");
        }
      }
    });
  </script>
  <script type="module" src="assets/js/access-logger.js"></script>
</body>
</html>
